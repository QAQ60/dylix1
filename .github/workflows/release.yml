name: Release simulator build

# 把已经构建好的模拟器产物发布成 GitHub Release（只在 ubuntu 上跑，不重新编译）。
# 只能发布模拟器包；可安装到真机的 IPA 需要你自己的签名证书与描述文件，不在这里发布。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签，例如 v1.0.9-workbuddy'
        required: true
        default: 'v1.0.9-workbuddy'
      run_id:
        description: '提供产物的 Build simulator app 运行 ID（留空自动找最新成功的）'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Find the latest successful build artifacts
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          RUN="${{ inputs.run_id }}"
          if [ -z "$RUN" ]; then
            RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --status success --limit 1 \
                  --json databaseId --jq '.[0].databaseId')
          fi
          echo "run-id=$RUN" >> "$GITHUB_OUTPUT"
          gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --json displayTitle,headSha

      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh run download "${{ steps.find.outputs.run-id }}" --repo "$GITHUB_REPOSITORY" \
            --name Dylix-simulator --dir out
          gh run download "${{ steps.find.outputs.run-id }}" --repo "$GITHUB_REPOSITORY" \
            --name build-log --dir out
          ls -lR out

      - name: Verify digest
        run: |
          set -eu
          cd out
          shasum -a 256 -c Dylix-simulator.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || 'v1.0.9-workbuddy' }}
        run: |
          set -eu
          BODY=$(cat <<'EOF'
          由 GitHub Actions 构建的 Dylix 模拟器包（含 WorkBuddy AI 服务商适配）。

          - `Dylix-simulator.zip`：`TheosMobileCompiler.app`，x86_64 模拟器版，只能在 Mac 的 iOS 模拟器中运行。
          - `build.log`：完整构建日志。

          这不是可安装到真机的 IPA：真机安装需要你自己的签名证书与描述文件，本仓库不附带任何个人签名材料。

          源码基于 https://github.com/yangokok886/dylix （GPL-3.0-or-later），改动见 `workbuddy` 分支与 CHANGELOG。
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/Dylix-simulator.zip out/Dylix-simulator.zip.sha256 out/build.log --clobber
            echo "上传到已存在的 Release $TAG"
          else
            gh release create "$TAG" out/Dylix-simulator.zip out/Dylix-simulator.zip.sha256 out/build.log \
              --title "Dylix 模拟器构建 $TAG" --notes "$BODY"
          fi
