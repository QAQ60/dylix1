name: Toolchain digest

# 只用来核对 downloads/ 下两个大文件与 dependencies.lock.json 的 SHA-256 是否一致。
on:
  workflow_dispatch:
  push:
    paths: ['downloads/manifest.json', 'dependencies.lock.json']

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Compare digests
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path('.')
          manifest = json.loads((root / 'downloads/manifest.json').read_text())
          expected = {e['path']: e['sha256'] for e in manifest['files']}
          for name, digest in expected.items():
              path = root / name
              if not path.is_file():
                  print(f'MISSING {name} (size {path.stat().st_size if path.exists() else 0})')
                  continue
              got = hashlib.sha256(path.read_bytes()).hexdigest()
              print(('OK    ' if got == digest else 'DIFF  ') + name + ' ' + str(path.stat().st_size))
          lock = json.loads((root / 'dependencies.lock.json').read_text())
          print('lock asset sha256:', lock['asset']['sha256'])
          sdk = hashlib.sha256()
          print('sdk files:', sum(1 for _ in (root / 'Resources/SDK').rglob('*') if _.is_file()))
          PY

      - name: Report advertised size
        run: |
          ls -l downloads || true
          git show --stat --oneline HEAD | head -20
