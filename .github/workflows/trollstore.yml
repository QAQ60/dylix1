name: Build TrollStore IPA

# 构建免签名（ad-hoc）的 Dylix IPA，供 TrollStore 安装。
# 不使用任何个人证书；App 与扩展都用 "-" 自身签名，TrollStore 安装时会重新签名并授权。
#
# 说明：GitHub 当前只有 macos-15 / macos-26 的 macOS 运行器（macos-13 已下线，
# macos-14 自 2026-11-02 起停止支持）。高峰期 macOS 运行器排队可能超过 15 分钟。
# 该任务在上一次超时后，可通过「Re-run failed jobs」或再次推送同一提交重试；
# 成功后会直接把 IPA 发布到 Release。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/trollstore.yml']

permissions:
  contents: write

concurrency:
  group: trollstore-release
  cancel-in-progress: false

jobs:
  trollstore:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
          cmake --version

      - name: Fetch pinned embedded toolchain
        run: python3 scripts/fetch_toolchain.py

      - name: Build device app
        run: |
          set -eu
          python3 scripts/build.py --sdk-root "$(xcrun --sdk iphoneos --show-sdk-path)" 2>&1 | tee build.log
          IPA=$(ls build/*-unsigned.ipa)
          echo "built: $IPA"
          mv "$IPA" build/Dylix-1.0.9-workbuddy-trollstore.ipa
          cd build
          shasum -a 256 Dylix-1.0.9-workbuddy-trollstore.ipa > Dylix-1.0.9-workbuddy-trollstore.ipa.sha256

      - name: Inspect IPA
        run: |
          set -eu
          IPA=build/Dylix-1.0.9-workbuddy-trollstore.ipa
          unzip -l "$IPA" | grep -E 'Payload/[^/]+\.app/$|\.appex/$|\.framework/$' | head -20
          rm -rf inspect && mkdir inspect
          unzip -q "$IPA" -d inspect
          APP="inspect/Payload/TheosMobileCompiler.app"
          codesign -dvv "$APP" 2>&1 | head -8 || true
          codesign -d --entitlements :- "$APP" 2>/dev/null | head -20 || true
          find "$APP" -name 'embedded.mobileprovision' -print

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trollstore-ipa
          path: |
            build/Dylix-1.0.9-workbuddy-trollstore.ipa
            build/Dylix-1.0.9-workbuddy-trollstore.ipa.sha256
            build.log
          if-no-files-found: warn

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG=v1.0.9-workbuddy-trollstore
          BODY=$(cat <<'EOF'
          Dylix 1.0.9（Build 201）+ WorkBuddy AI 服务商适配，免签名构建，供 TrollStore 安装。

          - `Dylix-1.0.9-workbuddy-trollstore.ipa`：ad-hoc 签名，没有使用任何个人证书。
          - `Dylix-1.0.9-workbuddy-trollstore.ipa.sha256`：校验值。
          - `build.log`：完整构建日志。

          **TrollStore 安装**：在 TrollStore 里打开本 IPA（或「Install IPA File」选择它）。
          TrollStore 会用 ldid 重新签名并授予平台权限，不需要 Apple 开发者证书。

          **不适用**：没有越狱或巨魔的设备无法安装，这类设备需要自己的签名证书。

          源码基于 https://github.com/yangokok886/dylix （GPL-3.0-or-later）。
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/Dylix-1.0.9-workbuddy-trollstore.ipa \
              build/Dylix-1.0.9-workbuddy-trollstore.ipa.sha256 build.log --clobber
          else
            gh release create "$TAG" build/Dylix-1.0.9-workbuddy-trollstore.ipa \
              build/Dylix-1.0.9-workbuddy-trollstore.ipa.sha256 build.log \
              --title "Dylix 1.0.9 WorkBuddy · TrollStore 免签名 IPA" --notes "$BODY"
          fi
