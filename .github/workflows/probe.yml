name: Build (probe)

on: workflow_dispatch

jobs:
  versions:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/checkout@v4

      - name: Versions
        run: |
          xcodebuild -version || true
          python3 --version
          cmake --version || true
          swift --version || true
          rustc --version || true
          uname -m
